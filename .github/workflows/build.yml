name: Build APK ve EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter projesini hazırla
        shell: bash
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=android --project-name robot_kumanda .
          cp /tmp/main.dart lib/main.dart
          flutter pub add http
          sed -i 's|<manifest\(.*\)>|<manifest\1><uses-permission android:name="android.permission.INTERNET"/>|' android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<application android:usesCleartextTraffic="true"|' android/app/src/main/AndroidManifest.xml

      - name: APK derle
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: robot-kumanda-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter projesini hazırla
        shell: bash
        run: |
          cp lib/main.dart /tmp/main.dart
          flutter create --platforms=windows --project-name robot_kumanda .
          cp /tmp/main.dart lib/main.dart
          flutter pub add http

      - name: Windows uygulamasını derle
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: robot-kumanda-windows
          path: build/windows/x64/runner/Release/
